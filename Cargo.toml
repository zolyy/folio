[workspace]
resolver = "3"
members = ["crates/folio-core", "crates/folio-ops", "crates/folio-render", "apps/folio-cli", "xtask"]
default-members = ["crates/folio-core", "crates/folio-ops", "crates/folio-render", "apps/folio-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zolyy/folio"
rust-version = "1.88"
authors = ["Folio contributors"]

[workspace.dependencies]
miniz_oxide = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
folio-core = { path = "crates/folio-core" }
folio-ops = { path = "crates/folio-ops" }
folio-render = { path = "crates/folio-render" }

# Never-crash rules (AGENTS.md §3). Tests may unwrap (see clippy.toml).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Dependencies (ciphers, hashes, deflate) are optimised even in debug builds:
# unoptimised AES-256 key derivation is ~30x slower and starves the CI runners.
[profile.dev.package."*"]
opt-level = 3
