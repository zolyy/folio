# Parity with Adobe Acrobat Pro — the honest ledger.
#
# One [[feature]] per id in PLAN.md section 1. Status is one of:
#   planned      not started
#   partial      works for some cases; `notes` says what is missing
#   shipped      works end to end; still `notes` for known gaps
#   out-of-scope deliberately not built
# `partial` and `shipped` must name passing tests in `evidence`.
# `cargo xtask parity` (part of `cargo xtask ci`) enforces all of this.

[[feature]]
id = "view.open"
name = "Deschidere PDF, inclusiv fișiere deteriorate (reparare automată)"
status = "partial"
evidence = ["written_documents_read_back", "xref_streams_object_streams_and_png_predictor", "incremental_updates_use_the_newest_objects", "broken_startxref_is_rebuilt_by_scanning", "mutated_documents_do_not_crash"]
notes = "Opens and repairs classic and compressed (PDF 1.5+) files. Missing: encrypted files (stage 2), display (stages 3-4)."

