# Parity with Adobe Acrobat Pro — the honest ledger.
#
# One [[feature]] per id in PLAN.md section 1. Status is one of:
#   planned      not started
#   partial      works for some cases; `notes` says what is missing
#   shipped      works end to end; still `notes` for known gaps
#   out-of-scope deliberately not built
# `partial` and `shipped` must name passing tests in `evidence`.
# `cargo xtask parity` (part of `cargo xtask ci`) enforces all of this.

[[feature]]
id = "view.open"
name = "Deschidere PDF, inclusiv fișiere deteriorate (reparare automată)"
status = "partial"
evidence = ["written_documents_read_back", "xref_streams_object_streams_and_png_predictor", "incremental_updates_use_the_newest_objects", "broken_startxref_is_rebuilt_by_scanning", "mutated_documents_do_not_crash"]
notes = "Opens and repairs classic and compressed (PDF 1.5+) files. Missing: encrypted files (stage 2), display (stages 3-4)."

[[feature]]
id = "view.render"
name = "Randare pagini: text, vectori, imagini, transparență, culori"
status = "partial"
evidence = ["fills_strokes_and_even_odd", "clipping_limits_painting", "colour_spaces_cmyk_separation_devicen", "constant_alpha_from_extgstate", "form_xobjects_use_matrix_and_bbox", "dashed_lines", "page_rotation_and_resolution", "matches_poppler_rendering", "stage3a_mutated_documents_do_not_crash", "raw_rgb_image_rows_start_at_the_top", "bit_depths_decode_arrays_and_indexed_colour", "stencil_masks_paint_the_fill_colour", "jpeg_colour_and_gray", "soft_masks_and_colour_key_masks", "ccitt_group4_fax_images", "inline_images_raw_and_filtered", "images_match_poppler", "stage3b_hostile_images_do_not_crash", "truetype_glyphs_and_advance_widths", "bare_cff_type1_and_type3_fonts", "composite_identity_h_font", "text_rendering_modes_stroke_and_clip", "text_matches_poppler", "stage3c_hostile_fonts_do_not_crash", "axial_shading_with_extend", "radial_shading_from_a_point", "function_based_shading_with_matrix", "gouraud_triangle_and_coons_patch_meshes", "tiling_patterns_coloured_and_uncoloured", "shading_pattern_fill", "luminosity_soft_mask", "transparency_group_alpha_applies_to_the_whole_group", "annotation_appearances_and_hidden_flag", "shading_page_matches_poppler", "stage3d_hostile_shading_and_transparency_do_not_crash", "glyph_with_absurd_outline_is_skipped_not_fatal"]
notes = "Stages 3a-3d: vector graphics, images of every kind, text with every font kind, shadings 1-7, tiling and shading patterns, soft masks, transparency groups, annotation appearances; matches Poppler on generated samples and on a real InDesign brochure. Missing: knockout and non-isolated groups (drawn isolated), overprint, vertical writing, predefined CJK CMaps, ICC colour management (CMYK uses the simple formula). JPEG 2000 and JBIG2 only covered by the anti-crash gate."

